[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-rag-eval"
version = "0.1.0"
description = "Standalone headless Python research testbed to benchmark edge foundation models under noisy context injection and modular CALM cross-attention composition."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
    "numpy>=1.24.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"
